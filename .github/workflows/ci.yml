name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key
      ALLOW_MOCK_IN_PROD: "true"
      EMAIL_PROVIDER: smtp
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      DATABASE_URL_TEST: postgresql://app:app@localhost:5433/app_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
      postgres-test:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning reads the whole history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known problems in the packages we ship. High and critical ones fail the build.
      - run: pnpm audit --prod --audit-level=high
      # Passwords, keys and tokens that were committed by mistake.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
